name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the crate version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --target ${{ matrix.target }} -p glori-cli
      - name: Check the binary
        run: |
          binary=target/${{ matrix.target }}/release/glori
          file "$binary"
          "$binary" --version | grep -q "${{ needs.check.outputs.version }}"
      - name: Package
        run: |
          version=${{ needs.check.outputs.version }}
          target=${{ matrix.target }}
          packaging/completions.sh target/$target/release/glori
          packaging/tarball.sh "$target" "$version"
          cargo deb -p glori-cli --no-build --no-strip --target "$target"
          cargo generate-rpm -p crates/glori-cli --target "$target"
          mkdir -p out
          cp dist/*.tar.gz out/
          cp target/$target/debian/*.deb out/
          cp target/$target/generate-rpm/*.rpm out/
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" --title "Glori ${{ needs.check.outputs.version }}" --generate-notes $prerelease
