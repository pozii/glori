name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -Eq '^v[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])(\.[1-9][0-9]*)?(-[0-9A-Za-z.]+)?$'; then
            echo "tag $tag is not a calendar version (vYYYY.MM.DD, vYYYY.MM.DD.N, optional -rc.N)" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_version=${version//-/\~}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --target ${{ matrix.target }} -p glori-cli
        env:
          GLORI_VERSION: ${{ needs.check.outputs.version }}
      - name: Check the binary
        run: |
          binary=target/${{ matrix.target }}/release/glori
          file "$binary"
          test "$("$binary" --version)" = "glori ${{ needs.check.outputs.version }}"
      - name: Package
        run: |
          version=${{ needs.check.outputs.version }}
          package_version=${{ needs.check.outputs.package_version }}
          target=${{ matrix.target }}
          packaging/completions.sh target/$target/release/glori
          packaging/tarball.sh "$target" "$version"
          cargo deb -p glori-cli --no-build --no-strip --target "$target" --deb-version "$package_version"
          cargo generate-rpm -p crates/glori-cli --target "$target" --set-metadata "version = \"$package_version\""
          mkdir -p out
          cp dist/*.tar.gz out/
          find target -name "glori_*.deb" -exec cp {} out/ \;
          find target -name "glori-*.rpm" -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" --title "Glori ${{ needs.check.outputs.version }}" --generate-notes $prerelease
